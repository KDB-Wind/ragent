name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-maven:
    name: backend-maven
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Spotless check
        # spotless apply 已绑定 compile 阶段，CI 必须显式跑 check 做门禁，
        # 避免 apply 静默改写工作树后混入流程。
        run: ./mvnw -B -ntp spotless:check

      - name: Build and test
        # verify 包含默认单元测试集合（集成测试已用 @Tag("integration") 隔离，
        # 不依赖 Milvus/PostgreSQL/Redis/模型 API，见根 pom surefire excludedGroups），
        # 同时完成打包；集成测试通过 -P integration 显式运行。
        run: ./mvnw -B -ntp verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports"
          if-no-files-found: ignore

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/**"
          if-no-files-found: warn
          retention-days: 14

  frontend-build-lint:
    name: frontend-build-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 硬门禁：代码必须可编译。
        run: npm run build

      - name: Test
        # 硬门禁：Vitest 单元测试和当前低基线 coverage ratchet 必须全绿。
        run: npm run test:coverage

      - name: Lint
        # 硬门禁：存量 lint 问题已清零（含 0 warnings，--max-warnings 0），
        # lint 成为与 build/test 同级的前端质量门禁。
        run: npm run lint

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/**
          if-no-files-found: warn
          retention-days: 14
