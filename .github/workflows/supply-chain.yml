name: Supply Chain

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-and-sca:
    name: sbom-and-sca
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate backend CycloneDX SBOM
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DskipTests

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend CycloneDX SBOM
        working-directory: frontend
        run: npm run sbom

      # 存量漏洞仍在治理中：定时/手动扫描上传 SARIF，但不以 exit-code 阻断。
      # PR 新增 High/Critical 依赖由 dependency-review 门禁负责。
      - name: Scan backend SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: sbom
          scan-ref: target/sbom/backend.cdx.json
          scanners: vuln
          vuln-type: library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-backend.sarif
          exit-code: "0"

      - name: Upload backend Trivy SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-sbom

      - name: Scan frontend SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: sbom
          scan-ref: frontend/frontend.cdx.json
          scanners: vuln
          vuln-type: library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "0"

      - name: Upload frontend Trivy SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-sbom

      - name: Upload SBOM and SCA artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            target/sbom/backend.cdx.json
            frontend/frontend.cdx.json
            trivy-backend.sarif
            trivy-frontend.sarif
          if-no-files-found: error
          retention-days: 30
